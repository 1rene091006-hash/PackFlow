<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f0"><meta name="apple-mobile-web-app-capable" content="yes"><title>PackFlow 3.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#25382f;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px 70px}h1{font-size:34px;margin:8px 0}h2{font-size:22px}small{color:#66756c}button,input,select,textarea{font:inherit;border:1px solid #cbd2c9;border-radius:10px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#315c48;color:white;border:0}button:disabled{opacity:.5}input,textarea,select{max-width:100%}textarea{width:100%;min-height:80px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.stats,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.panel,.card{background:white;border:1px solid #e0e3da;border-radius:16px;padding:16px}.card img{width:100%;height:155px;object-fit:cover;border-radius:10px}.stat{font-size:28px;font-weight:700}.tag{background:#e5eee5;padding:4px 8px;border-radius:8px;font-size:13px}dialog{border:0;border-radius:16px;width:min(94vw,650px);max-height:90vh;overflow:auto;padding:20px;color:inherit}dialog::backdrop{background:#0006}label{display:block;margin:10px 0}label input:not([type=checkbox]),label select{display:block;width:100%}.item{border-bottom:1px solid #e5e8e1;padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:100px}.danger{color:#a33}#status{overflow-wrap:anywhere} [hidden]{display:none!important}</style><main><small>HOME ORGANIZATION / INVENTORY</small><h1>PackFlow 3.0</h1><div id="status" role="status">正在连接…</div><section id="auth" class="panel" hidden><h2>云端登录</h2><p>首次使用请填写 Supabase 项目地址和公开密钥。每台设备使用同一账号。</p><label>项目 URL<input id="url" placeholder="https://xxx.supabase.co"></label><label>Publishable / anon key<input id="key"></label><label>邮箱<input id="email" type="email"></label><label>密码<input id="password" type="password" minlength="8"></label><div class="bar"><button id="login" class="primary">登录</button><button id="signup">注册</button></div></section><section id="app" hidden><div class="bar"><button id="sync">刷新云端</button><button id="logout">退出</button><button id="export">导出备份</button><button id="csv">导出物品 CSV</button><button id="import">导入 JSON</button><input type="file" id="file" accept=".json" hidden></div><div id="stats" class="stats"></div><div class="bar"><input id="search" class="grow" placeholder="搜索箱子或物品"><button class="primary" id="add">＋ 新增箱子</button></div><div id="cards" class="cards"></div><div id="results"></div></section></main><dialog id="dlg"></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>crypto.randomUUID();let client,user,data,rev, busy=false, channel;const status=t=>$('status').textContent=t;const blank=()=>({version:1,boxes:[],items:[],photos:[],settings:[]});const valid=d=>d&&Array.isArray(d.boxes)&&Array.isArray(d.items)&&Array.isArray(d.photos)&&d.boxes.every(b=>typeof b.id==='string')&&d.items.every(i=>d.boxes.some(b=>b.id===i.boxId));
function setup(){let u=$('url').value.trim(),k=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(u)||!k)throw Error('请填写正确的项目 URL 和公开密钥');localStorage.setItem('pf-config',JSON.stringify([u,k]));client=supabase.createClient(u,k);}
async function auth(sign){try{setup();let r=await client.auth[sign?'signUp':'signInWithPassword']({email:$('email').value,password:$('password').value});if(r.error)throw r.error;if(r.data.session)await start(r.data.session.user);else status('请检查邮箱确认链接，然后返回登录。')}catch(e){status(e.message)}}
async function start(u){user=u;$('auth').hidden=true;$('app').hidden=false;await load();if(channel)client.removeChannel(channel);channel=client.channel('pf-'+u.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'packflow',filter:'owner=eq.'+u.id},()=>{if(!busy&&!$('dlg').open)load()}).subscribe();}
async function load(){if(busy)return;try{let r=await client.from('packflow').select('payload,revision').eq('owner',user.id).maybeSingle();if(r.error)throw r.error;data=r.data?.payload??blank();rev=r.data?.revision??null;render();status('云端已读取 · '+new Date().toLocaleTimeString());if(rev===null)status('新账号：请导入随附的原始 JSON 备份。')}catch(e){status('读取失败：'+e.message)}}
async function change(fn){if(busy||!data)return false;busy=true;let next=structuredClone(data);try{fn(next);let r=rev===null?await client.from('packflow').insert({owner:user.id,payload:next,revision:1}).select('revision').single():await client.from('packflow').update({payload:next,revision:rev+1}).eq('owner',user.id).eq('revision',rev).select('revision').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('其他设备已更新，请关闭编辑窗口并刷新后重试');data=next;rev=r.data.revision;render();status('已保存到云端 · '+new Date().toLocaleTimeString());return true}catch(e){status('保存失败：'+e.message);alert(e.message);return false}finally{busy=false}}
function render(){let q=$('search').value.trim().toLowerCase(),bs=[...data.boxes].sort((a,b)=>a.order-b.order),is=data.items; $('stats').innerHTML=[['箱子',bs.length],['物品记录',is.length],['已封箱',bs.filter(b=>b.status==='已封箱').length+'/'+bs.length]].map(([k,v])=>`<div class="panel"><small>${k}</small><div class="stat">${v}</div></div>`).join('');$('cards').innerHTML=bs.filter(b=>!q||[b.number,b.name,b.category].join(' ').toLowerCase().includes(q)||is.some(i=>i.boxId===b.id&&i.name.toLowerCase().includes(q))).map(b=>{let p=data.photos.find(p=>p.id===b.cover)||data.photos.find(p=>p.boxId===b.id),n=is.filter(i=>i.boxId===b.id).length;return `<article class="card">${p&&/^data:image\/(jpeg|png|webp|gif);base64,/i.test(p.data)?`<img src="${esc(p.data)}" alt="箱子照片">`:''}<small>${esc(b.number)} · ${esc(b.size||b.type)}</small><h2>${esc(b.name)}</h2><span class="tag">${esc(b.status)}</span> <small>${n} 条物品</small><div class="bar"><button data-open="${esc(b.id)}">查看物品</button><button data-box="${esc(b.id)}">编辑</button></div></article>`}).join('');$('results').innerHTML=q?'<h2>匹配物品</h2>'+is.filter(i=>i.name.toLowerCase().includes(q)).map(i=>`<div class="item"><span class="grow">${esc(i.name)} · ${esc(i.quantity)} ${esc(i.unit)}</span><button data-open="${esc(i.boxId)}">${esc(bs.find(b=>b.id===i.boxId)?.number)}</button></div>`).join(''):'';}
function modal(html){$('dlg').innerHTML=html+'<div class="bar"><button data-close>关闭</button></div>';if(!$('dlg').open)$('dlg').showModal()}
const field=(n,v='',type='text')=>`<label>${n}<input name="${n}" type="${type}" value="${esc(v)}"></label>`;const select=(n,v,opts)=>`<label>${n}<select name="${n}">${[...new Set([v,...opts])].filter(Boolean).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
function boxEdit(id){let b=data.boxes.find(x=>x.id===id)||{};modal(`<h2>${id?'编辑':'新增'}箱子</h2><form id="bf">${field('编号',b.number||'')}${field('名称',b.name||'')}${field('类型',b.type||'纸箱')}${field('分类',b.category)}${field('尺寸',b.size)}${field('容量',b.capacity)}${select('状态',b.status||'未打包',['未打包','整理中','已打包','已封箱'])}${field('备注',b.notes)}<button class="primary">保存</button></form>${id?'<button class="danger" id="delbox">删除箱子及其物品</button>':''}`);$('bf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('编号').trim()||!f.get('名称').trim())return alert('请填写编号和名称');if(await change(d=>{let x={...b,id:b.id||uid(),number:f.get('编号'),name:f.get('名称'),type:f.get('类型'),category:f.get('分类'),size:f.get('尺寸'),capacity:f.get('容量'),status:f.get('状态'),notes:f.get('备注'),order:b.order??Date.now(),createdAt:b.createdAt??Date.now(),updatedAt:Date.now()};d.boxes=id?d.boxes.map(y=>y.id===id?x:y):[...d.boxes,x]}))$('dlg').close()};if(id)$('delbox').onclick=async()=>{if(confirm('删除箱子及其全部物品和照片？')&&await change(d=>{d.boxes=d.boxes.filter(x=>x.id!==id);d.items=d.items.filter(x=>x.boxId!==id);d.photos=d.photos.filter(x=>x.boxId!==id)}))$('dlg').close()}}
function openBox(id){let b=data.boxes.find(x=>x.id===id);if(!b)return;modal(`<h2>${esc(b.number)} · ${esc(b.name)}</h2><div class="bar"><button data-newitem="${esc(id)}" class="primary">＋ 添加物品</button><button data-bulk="${esc(id)}">批量添加</button><button data-photo="${esc(id)}">添加照片</button></div>${data.photos.filter(p=>p.boxId===id&&/^data:image\/(jpeg|png|webp|gif);base64,/i.test(p.data)).map(p=>`<img style="width:100%;max-height:220px;object-fit:contain" src="${esc(p.data)}"><button data-cover="${esc(p.id)}">设为封面</button>`).join('')}${data.items.filter(i=>i.boxId===id).sort((a,b)=>a.order-b.order).map(i=>`<div class="item"><input type="checkbox" data-check="${esc(i.id)}" ${i.packed?'checked':''}><span class="grow">${esc(i.name)} × ${esc(i.quantity)} ${esc(i.unit)}<br><small>${esc(i.category)}</small></span><button data-item="${esc(i.id)}">编辑</button></div>`).join('')}`)}
function itemEdit(id,bid){let i=data.items.find(x=>x.id===id)||{boxId:bid,quantity:1,unit:'件',packed:false};modal(`<h2>物品信息</h2><form id="it">${field('名称',i.name)}${field('数量',i.quantity,'number')}${field('单位',i.unit)}${field('分类',i.category)}<label>所属箱子<select name="box">${data.boxes.map(b=>`<option value="${esc(b.id)}" ${b.id===i.boxId?'selected':''}>${esc(b.number)} ${esc(b.name)}</option>`).join('')}</select></label>${field('备注',i.notes)}<label><input type="checkbox" name="packed" ${i.packed?'checked':''}> 已打包</label><button class="primary">保存</button></form>${id?'<button id="delitem" class="danger">删除物品</button>':''}`);$('it').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('名称').trim()||!f.get('数量')||Number(f.get('数量'))<0)return alert('请填写有效名称和数量');if(await change(d=>{let x={...i,id:i.id||uid(),name:f.get('名称'),quantity:Number(f.get('数量')),unit:f.get('单位'),category:f.get('分类'),boxId:f.get('box'),notes:f.get('备注'),packed:f.has('packed'),order:i.order??Date.now(),updatedAt:Date.now(),createdAt:i.createdAt??Date.now()};d.items=id?d.items.map(y=>y.id===id?x:y):[...d.items,x]}))openBox(f.get('box'))};if(id)$('delitem').onclick=async()=>{if(confirm('删除此物品？')&&await change(d=>d.items=d.items.filter(x=>x.id!==id)))openBox(i.boxId)}}
function bulk(id){modal('<h2>批量添加</h2><p>每行一个物品名称，默认数量 1。</p><textarea id="bulktext"></textarea><button id="bulksave" class="primary">保存</button>');$('bulksave').onclick=async()=>{let names=$('bulktext').value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(names.length&&await change(d=>names.forEach(name=>d.items.push({id:uid(),boxId:id,name,quantity:1,unit:'件',packed:false,order:Date.now()}))))openBox(id)}}
document.addEventListener('click',async e=>{let t=e.target.closest('button');if(!t)return;let a=t.dataset;if('close'in a)$('dlg').close();if(a.open)openBox(a.open);if(a.box)boxEdit(a.box);if(a.newitem)itemEdit(null,a.newitem);if(a.item)itemEdit(a.item);if(a.bulk)bulk(a.bulk);if(a.cover){let p=data.photos.find(x=>x.id===a.cover);if(await change(d=>d.boxes.find(b=>b.id===p.boxId).cover=p.id))openBox(p.boxId)}if(a.photo){let f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{let file=f.files[0];if(!file)return;try{let bitmap=await createImageBitmap(file),c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(bitmap.width,bitmap.height));c.width=Math.max(1,Math.round(bitmap.width*s));c.height=Math.max(1,Math.round(bitmap.height*s));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);let img=c.toDataURL('image/jpeg',.75);if(await change(d=>d.photos.push({id:uid(),boxId:a.photo,data:img,kind:'box',createdAt:Date.now()})))openBox(a.photo)}catch(e){alert(e.message)}};f.click()}});document.addEventListener('change',async e=>{let id=e.target.dataset.check;if(id){let checked=e.target.checked,bid=data.items.find(i=>i.id===id).boxId;await change(d=>d.items.find(i=>i.id===id).packed=checked);openBox(bid)}});
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('export').onclick=()=>data&&download('PackFlow-backup.json',JSON.stringify(data),'application/json');$('csv').onclick=()=>{if(!data)return;let rows=[['物品','数量','单位','分类','箱子','已打包'],...data.items.map(i=>[i.name,i.quantity,i.unit,i.category,data.boxes.find(b=>b.id===i.boxId)?.number,i.packed?'是':'否'])];download('PackFlow-items.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let d=JSON.parse(await $('file').files[0].text());if(!valid(d))throw Error('备份格式不正确');if(confirm(`导入 ${d.boxes.length} 个箱子、${d.items.length} 条物品？将替换当前云端数据，请先备份。`))await change(n=>{Object.keys(n).forEach(k=>delete n[k]);Object.assign(n,d)})}catch(e){alert(e.message)}$('file').value=''};$('search').oninput=()=>data&&render();$('add').onclick=()=>boxEdit(null);$('sync').onclick=load;$('login').onclick=()=>auth(false);$('signup').onclick=()=>auth(true);$('logout').onclick=async()=>{if(channel)await client.removeChannel(channel);await client.auth.signOut();data=null;user=null;$('app').hidden=true;$('auth').hidden=false;status('已退出')};window.addEventListener('focus',()=>{if(user&&!$('dlg').open)load()});setInterval(()=>{if(user&&!$('dlg').open)load()},30000);(async()=>{try{let cfg=JSON.parse(localStorage.getItem('pf-config')||'null');if(cfg){[$('url').value,$('key').value]=cfg;setup();let r=await client.auth.getSession();if(r.data.session){await start(r.data.session.user);return}}}catch(e){status(e.message)}$('auth').hidden=false;status('请登录云端账号')})();
</script></html>
